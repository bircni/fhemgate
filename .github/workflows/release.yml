name: Release

# a release is a tag vX.Y.Z that `bun run release` made and that was pushed. this checks the tagged
# commit, publishes it to npm with trusted publishing and creates the GitHub release with the
# message of the tag as its notes.
on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Check the tag and verify the tagged commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dist-tag: ${{ steps.tag.outputs.dist-tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Check that the tag is the version of package.json
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-tag.ts "$TAG" >> "$GITHUB_OUTPUT"
      # format check, lint, typecheck, tests, build, the packed plugin and the end-to-end tests
      # against the stand-in fhem
      - run: bun run verify

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # the OIDC token npm trusted publishing exchanges for the right to publish
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Check the tag and the npm that publishes
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-tag.ts "$TAG" --npm "$(npm --version)"
      # no token: npm publishes with trusted publishing and adds the provenance by itself. the
      # scripts are skipped, as the verify job ran what prepublishOnly would run. a version that is
      # on npm already, the first one that was published by hand or one of a run that is
      # repeated, is left as it is: npm never takes a version twice.
      - name: Publish
        env:
          DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
        run: |
          package=$(node -p "const p = require('./package.json'); p.name + '@' + p.version")
          published=$(npm view "$package" version 2> /dev/null || true)
          if [ -n "$published" ]; then
            echo "::notice::$package is on npm already and is not published again"
          else
            npm publish --ignore-scripts --tag "$DIST_TAG"
          fi

  github-release:
    name: Create the GitHub release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the annotated tag itself, whose message holds the release notes, and not only its commit
      - name: Fetch the tag
        env:
          TAG: ${{ github.ref_name }}
        run: git fetch --force --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: gh release create "$TAG" --verify-tag --notes-from-tag --title "$TAG" --prerelease="$PRERELEASE"
